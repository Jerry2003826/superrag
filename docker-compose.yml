services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      EBRAG_PROJECT__ENVIRONMENT: ${EBRAG_PROJECT__ENVIRONMENT:-dev}
      EBRAG_DATABASE__URL: postgresql+psycopg://ebrag:ebrag@postgres:5432/ebrag
      EBRAG_LLM__PROVIDER: ${EBRAG_LLM__PROVIDER:-fake}
      EBRAG_LLM__API_KEY: ${EBRAG_LLM__API_KEY:-}
      EBRAG_LLM__MODEL: ${EBRAG_LLM__MODEL:-gpt-4o-mini}
      EBRAG_LLM__BASE_URL: ${EBRAG_LLM__BASE_URL:-https://api.openai.com/v1}
      EBRAG_EMBEDDING__PROVIDER: ${EBRAG_EMBEDDING__PROVIDER:-fake}
      EBRAG_EMBEDDING__MODEL: ${EBRAG_EMBEDDING__MODEL:-BAAI/bge-small-en-v1.5}
      EBRAG_VECTOR__COLLECTION: ${EBRAG_VECTOR__COLLECTION:-evidence_spans}
      EBRAG_STORAGE__OBJECT_STORE: minio
      EBRAG_STORAGE__RAW_BUCKET: ${EBRAG_STORAGE__RAW_BUCKET:-raw-documents}
      EBRAG_STORAGE__PARSED_BUCKET: ${EBRAG_STORAGE__PARSED_BUCKET:-parsed-documents}
      EBRAG_STORAGE__PAGE_IMAGE_BUCKET: ${EBRAG_STORAGE__PAGE_IMAGE_BUCKET:-page-images}
      EBRAG_STORAGE__MINIO_ACCESS_KEY: ${EBRAG_STORAGE__MINIO_ACCESS_KEY:-minio}
      EBRAG_STORAGE__MINIO_SECRET_KEY: ${EBRAG_STORAGE__MINIO_SECRET_KEY:-minio123}
      EBRAG_STORAGE__MINIO_SECURE: ${EBRAG_STORAGE__MINIO_SECURE:-false}
      EBRAG_SERVICES__OPENSEARCH_URL: http://opensearch:9200
      EBRAG_SERVICES__QDRANT_URL: http://qdrant:6333
      EBRAG_SERVICES__NEO4J_URL: bolt://neo4j:7687
      EBRAG_SERVICES__MINIO_ENDPOINT: minio:9000
      EBRAG_SERVICES__REDIS_URL: redis://redis:6379/0
      EBRAG_SERVICES__GROBID_URL: http://grobid:8070
    ports:
      - "8000:8000"
    command: python /app/scripts/docker_api_entrypoint.py
    depends_on:
      - postgres
      - opensearch
      - qdrant
      - minio
      - redis
      - grobid

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ebrag
      POSTGRES_USER: ebrag
      POSTGRES_PASSWORD: ebrag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
