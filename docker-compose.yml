services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      EBRAG_PROJECT__ENVIRONMENT: ${EBRAG_PROJECT__ENVIRONMENT:-dev}
      EBRAG_DATABASE__URL: "postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ebrag}"
      EBRAG_LLM__PROVIDER: ${EBRAG_LLM__PROVIDER:-fake}
      EBRAG_LLM__API_KEY: ${EBRAG_LLM__API_KEY:-}
      EBRAG_LLM__MODEL: ${EBRAG_LLM__MODEL:-gpt-4o-mini}
      EBRAG_LLM__BASE_URL: ${EBRAG_LLM__BASE_URL:-https://api.openai.com/v1}
      EBRAG_EMBEDDING__PROVIDER: ${EBRAG_EMBEDDING__PROVIDER:-fake}
      EBRAG_EMBEDDING__MODEL: ${EBRAG_EMBEDDING__MODEL:-BAAI/bge-small-en-v1.5}
      EBRAG_VECTOR__COLLECTION: ${EBRAG_VECTOR__COLLECTION:-evidence_spans}
      EBRAG_STORAGE__OBJECT_STORE: minio
      EBRAG_STORAGE__RAW_BUCKET: ${EBRAG_STORAGE__RAW_BUCKET:-raw-documents}
      EBRAG_STORAGE__PARSED_BUCKET: ${EBRAG_STORAGE__PARSED_BUCKET:-parsed-documents}
      EBRAG_STORAGE__PAGE_IMAGE_BUCKET: ${EBRAG_STORAGE__PAGE_IMAGE_BUCKET:-page-images}
      EBRAG_STORAGE__MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      EBRAG_STORAGE__MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      EBRAG_STORAGE__MINIO_SECURE: ${EBRAG_STORAGE__MINIO_SECURE:-false}
      EBRAG_SERVICES__OPENSEARCH_URL: http://opensearch:9200
      EBRAG_SERVICES__QDRANT_URL: http://qdrant:6333
      EBRAG_SERVICES__NEO4J_URL: bolt://neo4j:7687
      EBRAG_SERVICES__MINIO_ENDPOINT: minio:9000
      EBRAG_SERVICES__REDIS_URL: redis://redis:6379/0
      EBRAG_SERVICES__GROBID_URL: http://grobid:8070
      EBRAG_SECURITY__API_KEY: ${EBRAG_SECURITY__API_KEY:?set EBRAG_SECURITY__API_KEY}
      EBRAG_SECURITY__CORS_ORIGINS: ${EBRAG_SECURITY__CORS_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      EBRAG_SECURITY__RATE_LIMIT_DEFAULT: ${EBRAG_SECURITY__RATE_LIMIT_DEFAULT:-120/minute}
      EBRAG_SECURITY__RATE_LIMIT_QUERY: ${EBRAG_SECURITY__RATE_LIMIT_QUERY:-30/minute}
      EBRAG_SECURITY__RATE_LIMIT_INGESTION: ${EBRAG_SECURITY__RATE_LIMIT_INGESTION:-10/minute}
      EBRAG_SECURITY__RATE_LIMIT_ADMIN: ${EBRAG_SECURITY__RATE_LIMIT_ADMIN:-5/hour}
      EBRAG_SECURITY__UPLOAD_MAX_BYTES: ${EBRAG_SECURITY__UPLOAD_MAX_BYTES:-52428800}
    ports:
      - "127.0.0.1:${EBRAG_API_PORT:-8000}:8000"
    command: python /app/scripts/docker_api_entrypoint.py
    depends_on:
      - postgres
      - opensearch
      - qdrant
      - minio
      - redis
      - grobid

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${EBRAG_FRONTEND_PORT:-3000}:80"
    depends_on:
      - api

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebrag}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?set NEO4J_AUTH}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  grobid:
    image: lfoppiano/grobid:0.8.0
    ports:
      - "127.0.0.1:${GROBID_PORT:-8070}:8070"

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  minio_data:
