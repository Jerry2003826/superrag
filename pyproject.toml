[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "evidence-bio-rag"
version = "0.1.0"
description = "Evidence-grounded Bio Systematic Review RAG Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "asyncpg>=0.29",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "opensearch-py>=2.4",
  "qdrant-client>=1.9",
  "neo4j>=5.18",
  "minio>=7.2",
  "celery>=5.3",
  "redis>=5.0",
  "sentence-transformers>=3.0",
  "FlagEmbedding>=1.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10"
]

[project.optional-dependencies]
eval = ["ragas>=0.1"]
ocr = ["pypdf>=4.0", "pdfplumber>=0.11"]
dev = ["ipython", "jupyter", "pre-commit", "types-PyYAML"]

[project.scripts]
ebrag = "ebrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ebrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
