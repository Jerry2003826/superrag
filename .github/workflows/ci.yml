name: CI

on:
  pull_request:
  push:
    branches:
      - feature/phase-0
      - feature/phase-1-registry
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest
